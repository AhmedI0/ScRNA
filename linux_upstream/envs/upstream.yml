# FASTQ -> count matrix toolchain (STARsolo) + light Python for conversions
name: ipf-upstream
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - star=2.7.11b
  - samtools>=1.19
  - seqkit
  - pigz
  - fastqc
  - multiqc
  - curl
  - aria2
  - numpy
  - scipy
  - pandas
  - h5py
  - anndata>=0.10
