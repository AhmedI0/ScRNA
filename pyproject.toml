[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipfatlas"
version = "1.0.0"
description = "Cross-cohort single-cell RNA-seq analysis of idiopathic pulmonary fibrosis (helper library for the analysis notebooks)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "M. Ahmed Mushtaq" }]
keywords = ["single-cell", "scRNA-seq", "pulmonary fibrosis", "IPF", "scverse"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
# notebook sources: a bare last expression displays a result; imports may follow markdown cells
"notebooks/py/*.py" = ["B018", "E402", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
